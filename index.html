<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فلورين للسفر والسياحة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-matte: #D4A843;
            --gold-light: #E8C876;
            --white: #FFFFFF;
            --off-white: #FFFAF0;
            --text-dark: #2D2D2D;
            --text-medium: #555555;
            --shadow-gold: rgba(212, 168, 67, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: linear-gradient(180deg, #FFFDF7 0%, #FFFAF0 30%, #FFF8E7 100%); color: var(--text-dark); overflow-x: hidden; }

        /* الهيدر وأدوات التحكم */
        header { background: var(--white); border-bottom: 3px solid var(--gold-matte); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 20px rgba(0,0,0,0.06); }
        .header-inner { max-width: 1200px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 50px; height: 50px; background: linear-gradient(135deg, #D4A843, #B8912F); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; }
        .logo-text h1 { font-size: 1.3rem; font-weight: 800; color: #3D2E0A; line-height: 1.1; }
        .controls { display: flex; gap: 10px; align-items: center; }
        select, .lang-btn { padding: 8px 12px; border: 1px solid var(--gold-light); border-radius: 6px; background: var(--white); cursor: pointer; font-weight: 600; outline: none; }
        .lang-btn:hover, select:hover { background: var(--off-white); }

        /* القسم الترحيبي */
        .hero { text-align: center; padding: 50px 20px; }
        .hero h2 { font-size: 2.2rem; margin-bottom: 15px; color: #3D2E0A; }
        .hero p { color: var(--text-medium); font-size: 1.1rem; }

        /* التمرير الأفقي للبطاقات */
        .section-title { text-align: center; margin: 40px 0 20px; }
        .section-title h3 { font-size: 1.6rem; color: #3D2E0A; position: relative; display: inline-block; margin-bottom: 10px; }
        .horizontal-scroll { display: flex; overflow-x: auto; gap: 20px; padding: 20px; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        
        .card { min-width: 300px; max-width: 300px; background: var(--white); border-radius: 15px; border: 1px solid #F0E4CC; scroll-snap-align: start; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--gold-matte); box-shadow: 0 10px 25px var(--shadow-gold); }
        .card-img { height: 180px; background-size: cover; background-position: center; position: relative; }
        .card-badge { position: absolute; top: 10px; right: 10px; background: var(--gold-matte); color: white; padding: 4px 12px; border-radius: 15px; font-size: 0.8rem; font-weight: bold; }
        .card-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 5px; }
        .card-price { font-size: 1.4rem; font-weight: 800; color: var(--gold-matte); margin: 15px 0; }
        .btn-book { text-align: center; padding: 10px; background: var(--gold-matte); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s; margin-top: auto; }
        .btn-book:hover { background: #C49635; }

        /* نموذج الحجز */
        .booking-form { max-width: 800px; margin: 40px auto; background: var(--white); padding: 30px; border-radius: 15px; border: 1px solid #F0E4CC; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #E0C878; border-radius: 8px; outline: none; }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="logo-area">
                <div class="logo-icon">✈</div>
                <div class="logo-text">
                    <h1 data-i18n="logoTitle">فلورين</h1>
                    <span data-i18n="logoSub">للسفر والسياحة</span>
                </div>
            </div>
            <div class="controls">
                <select id="currencySelector" onchange="updatePrices()">
                    <option value="USD">الدولار ($)</option>
                    <option value="SAR">الريال السعودي (SAR)</option>
                    <option value="EGP">الجنيه المصري (EGP)</option>
                    <option value="SDG">الجنيه السوداني (SDG)</option>
                </select>
                <button class="lang-btn" onclick="changeLang('ar')">AR</button>
                <button class="lang-btn" onclick="changeLang('en')">EN</button>
                <button class="lang-btn" onclick="changeLang('ja')">JA</button>
            </div>
        </div>
    </header>

    <div class="hero">
        <h2 data-i18n="heroTitle">اكتشف العالم مع فلورين</h2>
        <p data-i18n="heroDesc">أفضل العروض السياحية وتسهيلات التأشيرات لرحلة لا تُنسى.</p>
    </div>

    <!-- قسم العروض السياحية (تمرير أفقي) -->
    <div class="section-title">
        <h3 data-i18n="offersTitle">أحدث العروض السياحية</h3>
    </div>
    <div class="horizontal-scroll" id="offersContainer"></div>

    <!-- قسم التأشيرات (تمرير أفقي) -->
    <div class="section-title">
        <h3 data-i18n="visasTitle">تأشيرات السفر (الفيز)</h3>
    </div>
    <div class="horizontal-scroll" id="visasContainer"></div>

    <!-- نموذج الحجز -->
    <div class="booking-form">
        <div class="section-title">
            <h3 data-i18n="formTitle">نموذج طلب حجز</h3>
        </div>
        <div class="form-group">
            <label data-i18n="formName">الاسم الكامل</label>
            <input type="text">
        </div>
        <div class="form-group">
            <label data-i18n="formPhone">رقم الهاتف</label>
            <input type="tel">
        </div>
        <button class="btn-book" style="width:100%; border:none; cursor:pointer; font-size:1.1rem;" data-i18n="formSubmit">إرسال الطلب</button>
    </div>

    <script>
        // --- 1. إعدادات العملات والأسعار الأساسية (بالدولار لتسهيل التحويل) ---
        // ملاحظة: أسعار الصرف تقريبية ويمكنك تعديلها
        const exchangeRates = {
            USD: 1,
            SAR: 3.75,
            EGP: 48.0,
            SDG: 600.0 // سعر تقريبي للجنيه السوداني
        };

        let currentCurrency = 'USD';
        let currentLang = 'ar';

        // --- 2. بيانات العروض والفيز ---
        const offersData = [
            { id: 'off1', priceUSD: 666, img: 'https://images.unsplash.com/photo-1541358101376-79f9024041d8?w=500' }, // ~2500 SAR
            { id: 'off2', priceUSD: 1546, img: 'https://images.unsplash.com/photo-1514282401047-d79a71a590e8?w=500' }, // ~5800 SAR
            { id: 'off3', priceUSD: 853, img: 'https://images.unsplash.com/photo-1522083111822-42f275685d56?w=500' }  // ~3200 SAR
        ];

        const visasData = [
            { id: 'visa1', priceUSD: 204, img: 'https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=500' }, // 750 AED ~= 204 USD
            { id: 'visa2', priceUSD: 354, img: 'https://images.unsplash.com/photo-1582672060624-cb814c817531?w=500' }, // 1300 AED ~= 354 USD
            { id: 'visa3', priceUSD: 290, img: 'https://images.unsplash.com/photo-1539650116574-8efeb43e2750?w=500' }, // 290 USD لمصر
            { id: 'visa4', priceUSD: 300, img: 'https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=500' }  // 300 USD لإندونيسيا
        ];

        // --- 3. قاموس الترجمة (اللغات) ---
        const translations = {
            ar: {
                logoTitle: "فلورين", logoSub: "للسفر والسياحة",
                heroTitle: "اكتشف العالم مع فلورين", heroDesc: "أفضل العروض السياحية وتسهيلات التأشيرات لرحلة لا تُنسى.",
                offersTitle: "أحدث العروض السياحية", visasTitle: "تأشيرات السفر (الفيز)",
                formTitle: "نموذج طلب حجز", formName: "الاسم الكامل", formPhone: "رقم الهاتف", formSubmit: "إرسال الطلب",
                bookBtn: "طلب الخدمة",
                items: {
                    off1: { title: "عطلة في جورجيا", badge: "الأكثر مبيعاً" },
                    off2: { title: "سحر المالديف", badge: "عرض خاص" },
                    off3: { title: "استكشاف تركيا", badge: "جديد" },
                    visa1: { title: "تأشيرة الإمارات (شهر)", badge: "سريعة" },
                    visa2: { title: "تأشيرة الإمارات (شهرين)", badge: "مطلوبة" },
                    visa3: { title: "موافقة أمنية - مصر", badge: "مضمونة" },
                    visa4: { title: "تأشيرة إندونيسيا", badge: "سياحية" }
                }
            },
            en: {
                logoTitle: "Floren", logoSub: "Travel & Tourism",
                heroTitle: "Discover the World with Floren", heroDesc: "The best travel packages and visa facilities for an unforgettable journey.",
                offersTitle: "Latest Travel Packages", visasTitle: "Travel Visas",
                formTitle: "Booking Form", formName: "Full Name", formPhone: "Phone Number", formSubmit: "Submit Request",
                bookBtn: "Book Now",
                items: {
                    off1: { title: "Georgia Holiday", badge: "Best Seller" },
                    off2: { title: "Maldives Magic", badge: "Special" },
                    off3: { title: "Explore Turkey", badge: "New" },
                    visa1: { title: "UAE Visa (1 Month)", badge: "Fast" },
                    visa2: { title: "UAE Visa (2 Months)", badge: "Popular" },
                    visa3: { title: "Egypt Security Approval", badge: "Guaranteed" },
                    visa4: { title: "Indonesia Visa", badge: "Tourist" }
                }
            },
            ja: {
                logoTitle: "フローレン", logoSub: "旅行と観光",
                heroTitle: "フローレンで世界を発見", heroDesc: "忘れられない旅のための最高の旅行パッケージとビザ施設。",
                offersTitle: "最新の旅行パッケージ", visasTitle: "旅行ビザ",
                formTitle: "予約フォーム", formName: "氏名", formPhone: "電話番号", formSubmit: "リクエストを送信",
                bookBtn: "今すぐ予約",
                items: {
                    off1: { title: "ジョージアの休日", badge: "ベストセラー" },
                    off2: { title: "モルディブの魔法", badge: "特別" },
                    off3: { title: "トルコを探索", badge: "新着" },
                    visa1: { title: "UAEビザ（1ヶ月）", badge: "速い" },
                    visa2: { title: "UAEビザ（2ヶ月）", badge: "人気" },
                    visa3: { title: "エジプト治安承認", badge: "保証付き" },
                    visa4: { title: "インドネシアビザ", badge: "観光" }
                }
            }
        };

        // --- 4. دوال التحديث والعرض ---
        function formatPrice(priceUSD) {
            const converted = (priceUSD * exchangeRates[currentCurrency]).toFixed(0);
            const symbols = { USD: '$', SAR: ' SAR', EGP: ' EGP', SDG: ' SDG' };
            return converted + symbols[currentCurrency];
        }

        function renderCards() {
            const t = translations[currentLang];
            
            // رسم العروض
            const offersHtml = offersData.map(item => `
                <div class="card">
                    <div class="card-img" style="background-image: url('${item.img}')">
                        <span class="card-badge">${t.items[item.id].badge}</span>
                    </div>
                    <div class="card-content">
                        <div class="card-title">${t.items[item.id].title}</div>
                        <div class="card-price">${formatPrice(item.priceUSD)}</div>
                        <a href="#" class="btn-book">${t.bookBtn}</a>
                    </div>
                </div>
            `).join('');
            document.getElementById('offersContainer').innerHTML = offersHtml;

            // رسم الفيز
            const visasHtml = visasData.map(item => `
                <div class="card">
                    <div class="card-img" style="background-image: url('${item.img}')">
                        <span class="card-badge">${t.items[item.id].badge}</span>
                    </div>
                    <div class="card-content">
                        <div class="card-title">${t.items[item.id].title}</div>
                        <div class="card-price">${formatPrice(item.priceUSD)}</div>
                        <a href="#" class="btn-book">${t.bookBtn}</a>
                    </div>
                </div>
            `).join('');
            document.getElementById('visasContainer').innerHTML = visasHtml;
        }

        function updatePrices() {
            currentCurrency = document.getElementById('currencySelector').value;
            renderCards();
        }

        function changeLang(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            // تغيير اتجاه الصفحة
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';

            // تحديث النصوص الثابتة
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });

            // إعادة رسم البطاقات لتحديث نصوصها
            renderCards();
        }

        // التهيئة الأولية
        window.onload = () => {
            renderCards();
        };
    </script>
</body>
</html>
