<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فلورين للسفر والسياحة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-matte: #D4A843;
            --gold-light: #E8C876;
            --white: #FFFFFF;
            --off-white: #FFFAF0;
            --text-dark: #2D2D2D;
            --text-medium: #555555;
            --shadow-gold: rgba(212, 168, 67, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: linear-gradient(180deg, #FFFDF7 0%, #FFFAF0 30%, #FFF8E7 100%); color: var(--text-dark); overflow-x: hidden; }

        /* الهيدر وأدوات التحكم */
        header { background: var(--white); border-bottom: 3px solid var(--gold-matte); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 20px rgba(0,0,0,0.06); }
        .header-inner { max-width: 1200px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 50px; height: 50px; background: linear-gradient(135deg, #D4A843, #B8912F); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; }
        .logo-text h1 { font-size: 1.3rem; font-weight: 800; color: #3D2E0A; line-height: 1.1; }
        .controls { display: flex; gap: 10px; align-items: center; }
        select, .lang-btn { padding: 8px 12px; border: 1px solid var(--gold-light); border-radius: 6px; background: var(--white); cursor: pointer; font-weight: 600; outline: none; }
        .lang-btn:hover, select:hover { background: var(--off-white); }

        /* القسم الترحيبي */
        .hero { text-align: center; padding: 50px 20px; }
        .hero h2 { font-size: 2.2rem; margin-bottom: 15px; color: #3D2E0A; }
        .hero p { color: var(--text-medium); font-size: 1.1rem; }

        /* التمرير الأفقي للبطاقات */
        .section-title { text-align: center; margin: 40px 0 20px; }
        .section-title h3 { font-size: 1.6rem; color: #3D2E0A; position: relative; display: inline-block; margin-bottom: 10px; }
        .horizontal-scroll { display: flex; overflow-x: auto; gap: 20px; padding: 20px; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        
        .card { min-width: 300px; max-width: 300px; background: var(--white); border-radius: 15px; border: 1px solid #F0E4CC; scroll-snap-align: start; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--gold-matte); box-shadow: 0 10px 25px var(--shadow-gold); }
        .card-img { height: 180px; background-size: cover; background-position: center; position: relative; }
        .card-badge { position: absolute; top: 10px; right: 10px; background: var(--gold-matte); color: white; padding: 4px 12px; border-radius: 15px; font-size: 0.8rem; font-weight: bold; }
        .card-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 5px; }
        .card-price { font-size: 1.4rem; font-weight: 800; color: var(--gold-matte); margin: 15px 0; }
        .btn-book { text-align: center; padding: 10px; background: var(--gold-matte); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s; margin-top: auto; }
        .btn-book:hover { background: #C49635; }
/* نموذج الحجز الشامل */
.form-container { max-width: 900px; margin: 40px auto; background: var(--white); padding: 30px; border-radius: 15px; border: 1px solid #F0E4CC; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.form-container h2 { text-align: center; color: var(--gold-matte); margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 1.6rem; }
.form-section-title { font-size: 1.2rem; color: #2C3E50; margin: 25px 0 15px; font-weight: 700; background: #f8f9fa; padding: 10px; border-right: 4px solid var(--gold-matte); }
.row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
.col { flex: 1; min-width: 200px; }
.col label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
.col input, .col select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: 'Cairo', sans-serif; box-sizing: border-box; }
.col input:focus, .col select:focus { border-color: var(--gold-matte); outline: none; }
.hidden { display: none; }

    </style>
</head>

            <div class="col"><label>تاريخ استخراج الجواز</label><input type="date" id="passportIssue" required></div>
            <div class="col"><label>تاريخ انتهاء الجواز</label><input type="date" id="passportExpiry" required></div>
        </div>

                <label>نوع الرحلة</label>
                <select id="tripType" required>
                    <option value="ذهاب فقط">ذهاب فقط</option>
                    <option value="ذهاب وإياب">ذهاب وإياب</option>
                    <option value="وجهات متعددة">وجهات متعددة</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col"><label>من (المطار / الكود)</label><input type="text" id="flightFrom" placeholder="مثال: الخرطوم KRT" required></div>
            <div class="col"><label>إلى (المطار / الكود)</label><input type="text" id="flightTo" placeholder="مثال: دبي DXB" required></div>
        </div>
        <div class="row">
            <div class="col">
                <label>وقت الرحلة المفضل</label>
                <select id="flightTime">
                    <option value="صباح">صباح</option>
                    <option value="ظهر">ظهر</option>
                    <option value="عصر">عصر</option>
                    <option value="مساء">مساء</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col"><label>بالغ (12+ سنة)</label><input type="number" id="adults" min="1" value="1" required></div>
            <div class="col"><label>طفل (2-12 سنة)</label><input type="number" id="children" min="0" value="0"></div>
            <div class="col"><label>رضيع (0-2 سنة)</label><input type="number" id="infants" min="0" value="0"></div>
        </div>
        <div class="row">
            <div class="col">
                <label>خط الطيران</label>
                <select id="airlineType" onchange="toggleCustomAirline()">
                    <option value="كافة الخطوط">عرض كافة الخطوط المتاحة</option>
                    <option value="تحديد مخصص">تحديد مخصص (كتابة اسم أو كود الشركة)</option>
                </select>
            </div>
            <div class="col hidden" id="customAirlineDiv">
                <label>اسم أو كود شركة الطيران</label>
                <input type="text" id="customAirline" placeholder="مثال: Emirates أو EK">
            </div>
        </div>

        <div class="form-section-title">نظام الدفع</div>
        <div class="row">
            <div class="col">
                <label>طريقة الدفع المفضلة</label>
                <select id="paymentMethod" required>
                    <option value="فيزا">فيزا (Visa)</option>
                    <option value="ماستر كارد">ماستر كارد (MasterCard)</option>
                    <option value="حساب بنكي">حساب بنكي</option>
                    <option value="بنكك">تطبيق بنكك</option>
                    <option value="بنك أم درمان الوطني">بنك أم درمان الوطني</option>
                    <option value="فودافون كاش">فودافون كاش</option>
                    <option value="ماي كاشي">ماي كاشي (MyKashy)</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn-book" style="width: 100%; border: none; font-size: 1.2rem; cursor: pointer; padding: 15px; margin-top: 15px;">إرسال الطلب واعتماد الحجز</button>
    </form>
