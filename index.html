<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فلورين للسفر والسياحة - Florin Tours</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-matte: #A8894A;
            --gold-light: #C9A96E;
            --gold-bright: #D4BC8B;
            --dark-comfort: #1A1A1A;
            --dark-bg: #0D0D0D;
            --dark-card: #141414;
            --text-light: #E0E0E0;
            --text-muted: #999;
            --border-dark: #2A2A2A;
            --success: #4CAF50;
            --warning: #FF9800;
            --danger: #f44336;
            --info: #2196F3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: var(--dark-card);
            border-bottom: 2px solid var(--gold-matte);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(168, 137, 74, 0.1);
        }

        .header-top {
            background: var(--dark-comfort);
            padding: 8px 0;
            border-bottom: 1px solid var(--border-dark);
        }

        .header-top-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .header-top-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .header-top-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
            font-size: 13px;
        }

        .header-top-links a:hover {
            color: var(--gold-light);
        }

        .lang-switch {
            background: transparent;
            border: 1px solid var(--gold-matte);
            color: var(--gold-light);
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            transition: all 0.3s;
        }

        .lang-switch:hover {
            background: var(--gold-matte);
            color: var(--dark-comfort);
        }

        .header-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-svg {
            width: 70px;
            height: 70px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-text-en {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-light);
            letter-spacing: 1px;
        }

        .logo-text-ar {
            font-size: 16px;
            font-weight: 600;
            color: var(--gold-light);
        }

        .nav-menu {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-light);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 0;
            position: relative;
            transition: color 0.3s;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold-matte);
            transition: width 0.3s;
        }

        .nav-link:hover {
            color: var(--gold-light);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .btn-login {
            background: transparent;
            border: 2px solid var(--gold-matte);
            color: var(--gold-light);
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: var(--gold-matte);
            color: var(--dark-comfort);
        }

        .btn-signup {
            background: var(--gold-matte);
            border: 2px solid var(--gold-matte);
            color: var(--dark-comfort);
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-signup:hover {
            background: var(--gold-light);
            border-color: var(--gold-light);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--dark-comfort) 0%, var(--dark-bg) 100%);
            padding: 60px 20px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 50%, rgba(168, 137, 74, 0.05) 0%, transparent 50%);
        }

        .hero-content {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero-title {
            font-size: 48px;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 10px;
            text-align: center;
        }

        .hero-subtitle {
            font-size: 20px;
            color: var(--gold-light);
            text-align: center;
            margin-bottom: 40px;
        }

        /* Search Form */
        .search-container {
            background: var(--dark-card);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border-dark);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            margin: 0 auto;
        }

        .search-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-dark);
            padding-bottom: 15px;
        }

        .search-tab {
            padding: 10px 25px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
            border-radius: 8px;
        }

        .search-tab.active {
            background: var(--gold-matte);
            color: var(--dark-comfort);
        }

        .search-tab:hover:not(.active) {
            color: var(--gold-light);
            background: rgba(168, 137, 74, 0.1);
        }

        .search-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            background: var(--dark-bg);
            border: 1px solid var(--border-dark);
            color: var(--text-light);
            padding: 12px 15px;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--gold-matte);
            box-shadow: 0 0 0 3px rgba(168, 137, 74, 0.1);
        }

        .form-select {
            background: var(--dark-bg);
            border: 1px solid var(--border-dark);
            color: var(--text-light);
            padding: 12px 15px;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--gold-matte);
        }

        .btn-search {
            background: var(--gold-matte);
            color: var(--dark-comfort);
            border: none;
            padding: 14px 40px;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            height: 48px;
        }

        .btn-search:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(168, 137, 74, 0.3);
        }

        /* Offers Section */
        .offers-section {
            max-width: 1400px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 10px;
            text-align: center;
        }

        .section-subtitle {
            font-size: 16px;
            color: var(--gold-light);
            text-align: center;
            margin-bottom: 40px;
        }

        .offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .offer-card {
            background: var(--dark-card);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--border-dark);
            transition: all 0.3s;
            cursor: pointer;
        }

        .offer-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(168, 137, 74, 0.2);
            border-color: var(--gold-matte);
        }

        .offer-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--dark-comfort), var(--gold-matte));
            position: relative;
        }

        .offer-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--gold-matte);
            color: var(--dark-comfort);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .offer-details {
            padding: 20px;
        }

        .offer-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .offer-info {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .offer-price {
            font-size: 28px;
            font-weight: 700;
            color: var(--gold-light);
            margin-bottom: 15px;
        }

        .offer-price span {
            font-size: 14px;
            color: var(--text-muted);
        }

        .btn-book {
            width: 100%;
            background: var(--gold-matte);
            color: var(--dark-comfort);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-book:hover {
            background: var(--gold-light);
        }

        /* Features Section */
        .features-section {
            background: var(--dark-card);
            padding: 60px 20px;
            margin: 50px 0;
            border-top: 2px solid var(--gold-matte);
            border-bottom: 2px solid var(--gold-matte);
        }

        .features-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .feature-item {
            text-align: center;
            padding: 30px;
        }

        .feature-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .feature-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--gold-light);
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Footer */
        .footer {
            background: var(--dark-comfort);
            padding: 50px 20px 20px;
            border-top: 2px solid var(--gold-matte);
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            margin-bottom: 40px;
        }

        .footer-column h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--gold-light);
            margin-bottom: 20px;
        }

        .footer-links {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 10px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--gold-light);
        }

        .footer-bottom {
            max-width: 1400px;
            margin: 0 auto;
            padding-top: 20px;
            border-top: 1px solid var(--border-dark);
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--dark-card);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--border-dark);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: var(--gold-light);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 25px;
            text-align: center;
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Chat Widget */
        .chat-widget {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1500;
        }

        .chat-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gold-matte);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 5px 20px rgba(168, 137, 74, 0.4);
            transition: all 0.3s;
        }

        .chat-button:hover {
            transform: scale(1.1);
            background: var(--gold-light);
        }

        .chat-window {
            display: none;
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 350px;
            height: 500px;
            background: var(--dark-card);
            border-radius: 15px;
            border: 1px solid var(--border-dark);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            flex-direction: column;
        }

        .chat-window.active {
            display: flex;
        }

        .chat-header {
            background: var(--gold-matte);
            color: var(--dark-comfort);
            padding: 15px 20px;
            border-radius: 15px 15px 0 0;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 14px;
        }

        .message.bot {
            background: var(--dark-bg);
            color: var(--text-light);
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .message.user {
            background: var(--gold-matte);
            color: var(--dark-comfort);
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid var(--border-dark);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: var(--dark-bg);
            border: 1px solid var(--border-dark);
            color: var(--text-light);
            padding: 10px 15px;
            border-radius: 25px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
        }

        .chat-send {
            background: var(--gold-matte);
            color: var(--dark-comfort);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }

        .chat-send:hover {
            background: var(--gold-light);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 32px;
            }
            
            .search-form {
                grid-template-columns: 1fr;
            }
            
            .offers-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-menu {
                display: none;
            }
            
            .chat-window {
                width: 300px;
                height: 400px;
                right: -10px;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
