<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فلورين للسفر والسياحة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ألوان الوضع الفاتح (الافتراضي) */
            --gold-matte: #D4A843;
            --gold-light: #E8C876;
            --white: #FFFFFF;
            --bg-gradient-1: #FFFDF7;
            --bg-gradient-2: #FFFAF0;
            --bg-gradient-3: #FFF8E7;
            --text-dark: #2D2D2D;
            --text-medium: #555555;
            --shadow-color: rgba(0,0,0,0.06);
            --border-color: #F0E4CC;
            --input-bg: #FFFFFF;
            --input-border: #ccc;
            --section-bg: #f8f9fa;
        }

        /* ألوان الوضع الداكن */
        body.dark-mode {
            --white: #1E1E1E;
            --bg-gradient-1: #121212;
            --bg-gradient-2: #1A1A1A;
            --bg-gradient-3: #121212;
            --text-dark: #F5F5F5;
            --text-medium: #CCCCCC;
            --shadow-color: rgba(255,255,255,0.05);
            --border-color: #333333;
            --input-bg: #2D2D2D;
            --input-border: #444444;
            --section-bg: #2A2A2A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body { 
            background: linear-gradient(180deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 30%, var(--bg-gradient-3) 100%); 
            color: var(--text-dark); 
            overflow-x: hidden; 
            transition: background 0.3s, color 0.3s;
        }

        /* الهيدر وأدوات التحكم */
        header { 
            background: var(--white); 
            border-bottom: 3px solid var(--gold-matte); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 2px 20px var(--shadow-color); 
            transition: background 0.3s;
        }
        .header-inner { max-width: 1200px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
        
        /* قسم الشعار */
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 50px; height: 50px; object-fit: contain; border-radius: 8px; }
        .logo-text h1 { font-size: 1.3rem; font-weight: 800; color: var(--text-dark); line-height: 1.1; }
        
        .controls { display: flex; gap: 10px; align-items: center; }
        select, .lang-btn, .theme-btn { 
            padding: 8px 12px; 
            border: 1px solid var(--gold-light); 
            border-radius: 6px; 
            background: var(--input-bg); 
            color: var(--text-dark);
            cursor: pointer; 
            font-weight: 600; 
            outline: none; 
            transition: 0.3s;
        }
        .lang-btn:hover, select:hover, .theme-btn:hover { background: var(--gold-light); color: #fff; }

        /* القسم الترحيبي */
        .hero { text-align: center; padding: 50px 20px; }
        .hero h2 { font-size: 2.2rem; margin-bottom: 15px; color: var(--text-dark); }
        .hero p { color: var(--text-medium); font-size: 1.1rem; }

        /* نموذج الحجز الشامل */
        .form-container { 
            max-width: 900px; 
            margin: 40px auto; 
            background: var(--white); 
            padding: 30px; 
            border-radius: 15px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: background 0.3s, border-color 0.3s;
        }
        .form-container h2 { text-align: center; color: var(--gold-matte); margin-bottom: 30px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; font-size: 1.6rem; }
        .form-section-title { 
            font-size: 1.2rem; 
            color: var(--text-dark); 
            margin: 25px 0 15px; 
            font-weight: 700; 
            background: var(--section-bg); 
            padding: 10px; 
            border-right: 4px solid var(--gold-matte); 
            border-radius: 4px;
        }
        .row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .col { flex: 1; min-width: 200px; }
        .col label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; color: var(--text-dark); }
        .col input, .col select { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid var(--input-border); 
            border-radius: 6px; 
            font-family: 'Cairo', sans-serif; 
            box-sizing: border-box;
            background: var(--input-bg);
            color: var(--text-dark);
            transition: 0.3s;
        }
        .col input:focus, .col select:focus { border-color: var(--gold-matte); outline: none; box-shadow: 0 0 5px rgba(212, 168, 67, 0.5); }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--gold-matte);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .submit-btn:hover { background: #B8912F; }        /* التمرير الأفقي للبطاقات (الباقات والفيز) */
        .section-title { text-align: center; margin: 50px 0 20px; }
        .section-title h3 { font-size: 1.8rem; color: var(--gold-matte); position: relative; display: inline-block; margin-bottom: 10px; }
        .horizontal-scroll { display: flex; overflow-x: auto; gap: 20px; padding: 20px; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }

        .card { 
            min-width: 300px; 
            max-width: 300px; 
            background: var(--white); 
            border-radius: 15px; 
            border: 1px solid var(--border-color); 
            scroll-snap-align: start; 
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            box-shadow: 0 4px 15px var(--shadow-color); 
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s, background 0.3s; 
        }
        .card:hover { 
            transform: translateY(-5px); 
            border-color: var(--gold-matte); 
            box-shadow: 0 10px 25px rgba(212, 168, 67, 0.25); 
        }
        .card-img { height: 180px; background-size: cover; background-position: center; position: relative; background-color: #eee; }
        .card-badge { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            background: var(--gold-matte); 
            color: #fff; 
            padding: 4px 12px; 
            border-radius: 15px; 
            font-size: 0.8rem; 
            font-weight: bold; 
        }
        .card-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 5px; color: var(--text-dark); }
        .card-desc { font-size: 0.9rem; color: var(--text-medium); margin-bottom: 10px; line-height: 1.5; }
        .card-price { font-size: 1.4rem; font-weight: 800; color: var(--gold-matte); margin: 10px 0 15px; }
        .btn-book { 
            text-align: center; 
            padding: 10px; 
            background: var(--gold-matte); 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            transition: background 0.3s; 
            margin-top: auto; 
            border: none; 
            cursor: pointer; 
        }
        .btn-book:hover { background: #B8912F; }
        
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="logo-area">
                <!-- تم تعديل الأبعاد برمجياً لتتناسب مع تفاصيل الشعار الجديد وإلغاء النص المكرر -->
                <img src="florin-logo.png" alt="فلورين لخدمات السفر والسياحة" style="width: 90px; height: auto; object-fit: contain; cursor: pointer;">
            </div>
            
            <div class="controls">
                <select>
                    <option>الدولار ($)</option>
                    <option>الريال السعودي (SAR)</option>
                    <option>الجنيه المصري (EGP)</option>
                    <option>الجنيه السوداني (SDG)</option>
                </select>
                <button class="lang-btn">AR</button>
                <!-- زر التبديل بين الوضع الداكن والفاتح -->
                <button id="theme-toggle" class="theme-btn">🌙</button>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <h2>اكتشف العالم مع فلورين</h2>
            <p>أفضل العروض السياحية وتسهيلات التأشيرات لرحلة لا تُنسى.</p>
        </section>

        <section class="form-container">
            <h2>نموذج الحجز الشامل</h2>
            
            <form action="#" method="POST">
                <!-- بيانات العميل وجواز السفر -->
                <div class="form-section-title">بيانات العميل وجواز السفر</div>
                <div class="row">
                    <div class="col">
                        <label>الاسم الأول</label>
                        <input type="text" placeholder="الاسم الأول" required>
                    </div>
                    <div class="col">
                        <label>الاسم الأخير</label>
                        <input type="text" placeholder="الاسم الأخير" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>تاريخ الميلاد</label>
                        <input type="date" required>
                    </div>
                    <div class="col">
                        <label>رقم جواز السفر</label>
                        <input type="text" placeholder="رقم الجواز" required>
                    </div>
                </div>
                <!-- يمكن إضافة المزيد من الحقول هنا -->
                <button type="submit" class="submit-btn">إرسال الطلب</button>
            </form>
        </section>
    </main>

</body>
</html>
