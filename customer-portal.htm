<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة العملاء - فلورين للسياحة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-gold: #bfa030;
            --bg-color: #f8fafc;
            --text-dark: #2c3e50;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
        }

        /* الشريط العلوي */
        .navbar {
            background-color: var(--white);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-gold);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
        }

        .logout-btn {
            background: none;
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 6px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #e74c3c;
            color: var(--white);
        }

        /* حاوية المحتوى */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            margin-bottom: 30px;
            font-size: 24px;
            border-right: 4px solid var(--primary-gold);
            padding-right: 15px;
        }

        /* شبكة العروض */
        .offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .offer-card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }

        .offer-card:hover {
            transform: translateY(-5px);
        }

        .offer-image {
            height: 200px;
            background-color: #e0e6ed;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #95a5a6;
            font-size: 40px;
            position: relative;
        }

        .offer-price {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: var(--primary-gold);
            color: var(--white);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .offer-details {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .offer-details h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }

        .offer-details p {
            color: #7f8c8d;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .book-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--text-dark);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: auto;
        }

        .book-btn:hover {
            background-color: var(--primary-gold);
        }

        .empty-message {
            text-align: center;
            color: #7f8c8d;
            padding: 40px;
            background: var(--white);
            border-radius: 10px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <nav class="navbar">
        <div class="brand-logo">
            <i class="fas fa-globe-americas"></i>
            فلورين للسياحة
        </div>
        <div class="user-profile">
            <span id="displayUserEmail">جاري التحميل...</span>
            <button class="logout-btn" onclick="customerLogout()">تسجيل الخروج</button>
        </div>
    </nav>

    <div class="container">
        <h2 class="section-title">أحدث العروض السياحية</h2>
        
        <!-- الحاوية التي سيتم ضخ العروض بداخلها برمجياً -->
        <div class="offers-grid" id="dynamicOffersContainer">
            <!-- العروض ستظهر هنا -->
        </div>
    </div>

    <script>
        let currentCustomer = null;

        // التحقق من جلسة العميل
        function checkCustomerSession() {
            const customerData = localStorage.getItem('florinCurrentCustomer');
            if (customerData) {
                currentCustomer = JSON.parse(customerData);
                document.getElementById('displayUserEmail').textContent = currentCustomer.email;
                loadDynamicOffers(); // تحميل العروض بعد التأكد من تسجيل الدخول
            } else {
                alert('يرجى تسجيل الدخول أولاً للوصول للعروض.');
                window.location.href = 'login.html';
            }
        }

        // جلب العروض من قاعدة البيانات المحلية وعرضها
        function loadDynamicOffers() {
            const container = document.getElementById('dynamicOffersContainer');
            container.innerHTML = ''; // تفريغ الحاوية

            const savedOffers = localStorage.getItem('florinOffers');
            let offers = savedOffers ? JSON.parse(savedOffers) : [];

            if (offers.length === 0) {
                container.innerHTML = '<div class="empty-message">نعتذر، لا توجد عروض متاحة حالياً. يرجى التحقق لاحقاً.</div>';
                return;
            }

            offers.forEach(offer => {
                // تحديد أيقونة افتراضية إذا لم يضع المدير رابط صورة
                let imageStyle = offer.image ? `background-image: url('${offer.image}');` : '';
                let iconHtml = offer.image ? '' : '<i class="fas fa-image"></i>';

                const cardHtml = `
                    <div class="offer-card">
                        <div class="offer-image" style="${imageStyle}">
                            ${iconHtml}
                            <div class="offer-price">${offer.price}$</div>
                        </div>
                        <div class="offer-details">
                            <h3>${offer.title}</h3>
                            <p>${offer.description}</p>
                            <button class="book-btn" onclick="bookOffer('${offer.title}')">احجز الآن</button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // دالة حجز العرض وإرساله للوحة الإدارة
        function bookOffer(offerName) {
            if (!currentCustomer) return;

            let bookings = [];
            const savedBookings = localStorage.getItem('florinBookings');
            if (savedBookings) {
                bookings = JSON.parse(savedBookings);
            }

            const today = new Date().toISOString().split('T')[0];

            const newBooking = {
                name: currentCustomer.phone, 
                destination: offerName,
                date: today,
                status: 'pending' 
            };

            bookings.push(newBooking);
            localStorage.setItem('florinBookings', JSON.stringify(bookings));

            alert(`تم استلام طلبك لـ [${offerName}] بنجاح! فريقنا سيتواصل معك قريباً لتأكيد الحجز.`);
        }

        // دالة تسجيل خروج العميل
        function customerLogout() {
            localStorage.removeItem('florinCurrentCustomer');
            window.location.href = 'login.html';
        }

        // التشغيل
        checkCustomerSession();
    </script>
</body>
</html>
