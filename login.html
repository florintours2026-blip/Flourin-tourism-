<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - فلورين للسياحة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-gold: #bfa030;
            --bg-color: #f0f2f5;
            --text-dark: #2c3e50;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .split-container {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: var(--white);
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin: 20px;
        }

        .form-section {
            flex: 1;
            padding: 40px;
            box-sizing: border-box;
        }

        .admin-section {
            background-color: #f8fafc;
            border-left: 2px solid #eee;
        }

        .customer-section {
            background-color: var(--white);
        }

        .section-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .section-header i {
            font-size: 40px;
            color: var(--primary-gold);
            margin-bottom: 10px;
        }

        .section-header h2 {
            margin: 0;
            color: var(--text-dark);
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid #e0e6ed;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary-gold);
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-gold);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-btn:hover {
            background-color: var(--dark-gold);
        }

        /* استجابة الشاشات الصغيرة */
        @media (max-width: 768px) {
            .split-container {
                flex-direction: column;
            }
            .admin-section {
                border-left: none;
                border-top: 2px solid #eee;
            }
        }
    </style>
</head>
<body>

    <div class="split-container">
        
        <!-- قسم دخول العملاء -->
        <div class="form-section customer-section">
            <div class="section-header">
                <i class="fas fa-user"></i>
                <h2>دخول العملاء</h2>
                <p style="color: #7f8c8d; font-size: 13px;">استكشف أفضل العروض السياحية</p>
            </div>
            <form id="customerForm">
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="customerEmail" required placeholder="أدخل بريدك الإلكتروني">
                </div>
                <div class="input-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="customerPhone" required placeholder="أدخل رقم هاتفك">
                </div>
                <button type="submit" class="login-btn">دخول للموقع</button>
            </form>
        </div>

        <!-- قسم دخول الإدارة -->
        <div class="form-section admin-section">
            <div class="section-header">
                <i class="fas fa-user-shield"></i>
                <h2>بوابة الإدارة</h2>
                <p style="color: #7f8c8d; font-size: 13px;">لوحة تحكم فلورين للسياحة</p>
            </div>
            <form id="adminForm">
                <div class="input-group">
                    <label>البريد الإلكتروني للإدارة</label>
                    <input type="email" id="adminEmail" required placeholder="admin@florin.com">
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="adminPassword" required placeholder="أدخل كلمة المرور">
                </div>
                <button type="submit" class="login-btn">تسجيل الدخول</button>
            </form>
        </div>

    </div>

    <script>
        // إعدادات الإدارة
        const ADMIN_EMAIL = 'firassaeed44@gmail.com';
        const ADMIN_PASSWORD = 'Flourin@33';

        // معالجة دخول الإدارة
        document.getElementById('adminForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;

            if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                window.location.href = 'dashboard.html';
            } else {
                alert('بيانات الإدارة غير صحيحة.');
            }
        });

        // معالجة دخول العملاء
        document.getElementById('customerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('customerEmail').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();

            if (email && phone) {
                // حفظ بيانات العميل محلياً لاستخدامها لاحقاً في عمليات الحجز
                const customerData = { email: email, phone: phone };
                localStorage.setItem('florinCurrentCustomer', JSON.stringify(customerData));
                
                alert('تم تسجيل الدخول بنجاح كعميل! سيتم توجيهك لصفحة العروض قريباً.');
                // مستقبلاً سنضيف: window.location.href = 'customer-portal.html';
            }
        });
    </script>
</body>
</html>
