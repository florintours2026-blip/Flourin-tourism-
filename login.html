<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - فلورين للسياحة</title>
    <style>
        /* إعدادات عامة للصفحة */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* حاوية نموذج تسجيل الدخول */
        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* تنسيق الشعار والعنوان */
        .login-container img {
            width: 100px;
            margin-bottom: 15px;
        }

        .login-container h2 {
            margin: 0 0 20px;
            color: #333;
            font-size: 24px;
        }

        /* تنسيقات حقول الإدخال */
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #d4af37;
            outline: none;
        }

        /* تنسيق زر تسجيل الدخول */
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #d4af37;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        .login-btn:hover {
            background-color: #bfa030;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        /* روابط إضافية */
        .extra-links {
            margin-top: 20px;
            font-size: 14px;
        }

        .extra-links a {
            color: #d4af37;
            text-decoration: none;
            transition: color 0.3s;
        }

        .extra-links a:hover {
            color: #333;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- يمكنك وضع مسار شعار فلورين هنا -->
        <img src="logo.png" alt="شعار فلورين">
        <h2>تسجيل الدخول</h2>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required>
            </div>
            
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
            </div>
            
            <button type="submit" class="login-btn">دخول</button>
        </form>

        <div class="extra-links">
            <p>هل نسيت كلمة المرور؟ <a href="#">استعادة الآن</a></p>
            <p>ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a></p>
        </div>
    </div>

    <script>
        // برمجة التفاعل مع نموذج تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // منع تحديث الصفحة
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // محاكاة عملية التحقق من البيانات
            if(email && password) {
                alert('تم تسجيل الدخول بنجاح! جاري توجيهك...');
                // يمكنك إضافة كود التوجيه هنا مستقبلاً
                // window.location.href = 'dashboard.html';
            }
        });
    </script>

</body>
</html>
