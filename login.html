<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الإدارة - فلورين للسياحة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-gold: #bfa030;
            --bg-color: #f0f2f5;
            --text-dark: #2c3e50;
            --error-red: #e74c3c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-wrapper {
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            transition: transform 0.3s ease;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-header img {
            width: 120px;
            margin-bottom: 15px;
        }

        .brand-header h2 {
            margin: 0;
            color: var(--text-dark);
            font-size: 26px;
            letter-spacing: 0.5px;
        }

        .brand-header p {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 5px;
        }

        .input-group {
            margin-bottom: 22px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.icon-main {
            position: absolute;
            right: 15px;
            color: #95a5a6;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 40px 14px 15px;
            border: 1.5px solid #e0e6ed;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
            box-sizing: border-box;
            background-color: #f8fafc;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-gold);
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .toggle-password {
            position: absolute;
            left: 15px;
            cursor: pointer;
            color: #95a5a6;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: var(--primary-gold);
        }

        .error-message {
            color: var(--error-red);
            font-size: 13px;
            margin-top: 5px;
            display: none;
            font-weight: 500;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-gold);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .login-btn:hover {
            background-color: var(--dark-gold);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .login-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="brand-header">
            <!-- استبدل الرابط أدناه بمسار شعار الشركة الفعلي -->
            <img src="logo.png" alt="شعار فلورين للسياحة">
            <h2>بوابة الإدارة</h2>
            <p>الرجاء إدخال بيانات الاعتماد للوصول للوحة التحكم</p>
        </div>
        
        <form id="adminLoginForm">
            <div class="input-group">
                <label for="adminEmail">البريد الإلكتروني الإداري</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope icon-main"></i>
                    <input type="email" id="adminEmail" placeholder="admin@florin-tourism.com" required autocomplete="email">
                </div>
                <div id="emailError" class="error-message">صيغة البريد الإلكتروني غير صحيحة.</div>
            </div>
            
            <div class="input-group">
                <label for="adminPassword">كلمة المرور</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock icon-main"></i>
                    <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                    <i class="fas fa-eye toggle-password" id="togglePassword" title="عرض/إخفاء كلمة المرور"></i>
                </div>
                <div id="loginError" class="error-message">بيانات الدخول غير صحيحة. يرجى المحاولة مجدداً.</div>
            </div>
            
            <button type="submit" class="login-btn" id="submitBtn">
                <span id="btnText">تسجيل الدخول</span>
                <div class="spinner" id="loadingSpinner"></div>
            </button>
        </form>
    </div>

    <script>
        // إعدادات واجهة برمجة التطبيقات (API)
        // يجب استبدال هذا الرابط بالرابط الفعلي للخادم الخاص بك
        const API_LOGIN_ENDPOINT = 'https://api.florin-tourism.com/v1/admin/login';
        const DASHBOARD_URL = '/admin/dashboard.html';

        // عناصر واجهة المستخدم
        const loginForm = document.getElementById('adminLoginForm');
        const emailInput = document.getElementById('adminEmail');
        const passwordInput = document.getElementById('adminPassword');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const emailError = document.getElementById('emailError');
        const loginError = document.getElementById('loginError');
        const togglePassword = document.getElementById('togglePassword');

        // ميزة إظهار وإخفاء كلمة المرور
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // إخفاء رسائل الخطأ عند بدء الكتابة
        emailInput.addEventListener('input', () => emailError.style.display = 'none');
        passwordInput.addEventListener('input', () => loginError.style.display = 'none');

        // التحقق من صحة البريد الإلكتروني
        function isValidEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        // معالجة إرسال النموذج
        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // تحقق مبدئي من صيغة البريد
            if (!isValidEmail(email)) {
                emailError.style.display = 'block';
                return;
            }

            // تفعيل حالة التحميل
            submitBtn.disabled = true;
            btnText.textContent = 'جاري التحقق...';
            loadingSpinner.style.display = 'block';
            loginError.style.display = 'none';

            try {
                // إرسال الطلب الفعلي للخادم
                const response = await fetch(API_LOGIN_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // حفظ رمز التوثيق (Token) في المتصفح
                    localStorage.setItem('adminToken', data.token);
                    
                    // توجيه المسؤول إلى لوحة التحكم
                    window.location.href = DASHBOARD_URL;
                } else {
                    // عرض رسالة خطأ في حال رفض الخادم للبيانات
                    loginError.textContent = data.message || 'بيانات الدخول غير صحيحة. يرجى المحاولة مجدداً.';
                    loginError.style.display = 'block';
                }
            } catch (error) {
                // التعامل مع أخطاء الاتصال بالشبكة
                loginError.textContent = 'حدث خطأ في الاتصال بالخادم. يرجى التحقق من اتصالك بالإنترنت.';
                loginError.style.display = 'block';
            } finally {
                // إيقاف حالة التحميل
                submitBtn.disabled = false;
                btnText.textContent = 'تسجيل الدخول';
                loadingSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
