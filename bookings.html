<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الحجوزات - فلورين للسياحة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* نفس الإعدادات العامة للوحة التحكم للحفاظ على الهوية */
        :root {
            --primary-gold: #d4af37;
            --dark-gold: #bfa030;
            --sidebar-bg: #2c3e50;
            --bg-color: #f4f6f9;
            --text-dark: #333;
            --text-light: #ecf0f1;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            min-height: 100vh;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100%;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h2 {
            margin: 0;
            color: var(--primary-gold);
            font-size: 22px;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            flex-grow: 1;
        }

        .nav-links li { padding: 10px 20px; }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: var(--primary-gold);
            color: var(--white);
        }

        /* مساحة العمل الرئيسية */
        .main-content {
            margin-right: 250px;
            padding: 30px;
            flex-grow: 1;
            width: calc(100% - 250px);
            box-sizing: border-box;
        }

        .page-title {
            margin-top: 0;
            color: var(--text-dark);
            margin-bottom: 20px;
        }

        /* تقسيم الشاشة لنموذج الإدخال وجدول العرض */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .panel {
            background: var(--white);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* تنسيق نموذج الإدخال */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-dark);
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-gold);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover { background-color: var(--dark-gold); }

        /* تنسيق الجدول */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }

        th { background-color: #f8fafc; color: #555; }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete:hover { background-color: #c0392b; }

        .status {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .status.confirmed { background-color: #d4edda; color: #155724; }
        .status.pending { background-color: #fff3cd; color: #856404; }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>فلورين للسياحة</h2>
        </div>
        <ul class="nav-links">
            <!-- لاحظ كيف تم تعديل الرابط للعودة للرئيسية -->
            <li><a href="dashboard.html"><i class="fas fa-home"></i> الرئيسية</a></li>
            <li><a href="bookings.html" class="active"><i class="fas fa-plane-departure"></i> الحجوزات</a></li>
            <li><a href="#"><i class="fas fa-users"></i> العملاء</a></li>
            <li><a href="#"><i class="fas fa-cog"></i> الإعدادات</a></li>
        </ul>
    </aside>

    <!-- مساحة العمل الرئيسية -->
    <main class="main-content">
        <h2 class="page-title">إدارة الحجوزات</h2>
        
        <div class="content-grid">
            <!-- قسم إضافة حجز جديد -->
            <div class="panel">
                <h3>إضافة حجز جديد</h3>
                <form id="bookingForm">
                    <div class="form-group">
                        <label>اسم العميل</label>
                        <input type="text" id="clientName" required placeholder="أدخل اسم العميل">
                    </div>
                    <div class="form-group">
                        <label>الوجهة السياحية</label>
                        <input type="text" id="destination" required placeholder="مثال: جزر المالديف">
                    </div>
                    <div class="form-group">
                        <label>تاريخ السفر</label>
                        <input type="date" id="travelDate" required>
                    </div>
                    <div class="form-group">
                        <label>حالة الحجز</label>
                        <select id="bookingStatus">
                            <option value="confirmed">مؤكد</option>
                            <option value="pending">قيد الانتظار</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">حفظ الحجز</button>
                </form>
            </div>

            <!-- قسم عرض الحجوزات -->
            <div class="panel">
                <h3>سجل الحجوزات</h3>
                <table>
                    <thead>
                        <tr>
                            <th>العميل</th>
                            <th>الوجهة</th>
                            <th>التاريخ</th>
                            <th>الحالة</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTableBody">
                        <!-- سيتم إضافة الحجوزات هنا برمجياً -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // مصفوفة لتخزين الحجوزات
        let bookings = [];

        // دالة لتحميل البيانات من التخزين المحلي عند فتح الصفحة
        function loadBookings() {
            const savedBookings = localStorage.getItem('florinBookings');
            if (savedBookings) {
                bookings = JSON.parse(savedBookings);
            }
            renderTable();
        }

        // دالة لحفظ البيانات في التخزين المحلي
        function saveBookings() {
            localStorage.setItem('florinBookings', JSON.stringify(bookings));
        }

        // دالة لعرض البيانات في الجدول
        function renderTable() {
            const tbody = document.getElementById('bookingsTableBody');
            tbody.innerHTML = ''; // تفريغ الجدول قبل إعادة الرسم

            bookings.forEach((booking, index) => {
                const statusClass = booking.status === 'confirmed' ? 'confirmed' : 'pending';
                const statusText = booking.status === 'confirmed' ? 'مؤكد' : 'قيد الانتظار';

                const row = `
                    <tr>
                        <td>${booking.name}</td>
                        <td>${booking.destination}</td>
                        <td>${booking.date}</td>
                        <td><span class="status ${statusClass}">${statusText}</span></td>
                        <td><button class="btn-delete" onclick="deleteBooking(${index})">حذف</button></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // معالجة نموذج إدخال حجز جديد
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault(); // منع تحديث الصفحة

            // جلب القيم من الحقول
            const newBooking = {
                name: document.getElementById('clientName').value,
                destination: document.getElementById('destination').value,
                date: document.getElementById('travelDate').value,
                status: document.getElementById('bookingStatus').value
            };

            // إضافة الحجز للمصفوفة وحفظه
            bookings.push(newBooking);
            saveBookings();
            renderTable();

            // تفريغ الحقول بعد الحفظ
            this.reset();
        });

        // دالة لحذف حجز معين
        function deleteBooking(index) {
            if(confirm('هل أنت متأكد من حذف هذا الحجز؟')) {
                bookings.splice(index, 1); // إزالة العنصر من المصفوفة
                saveBookings(); // تحديث التخزين المحلي
                renderTable(); // إعادة رسم الجدول
            }
        }

        // تشغيل دالة التحميل عند بدء تشغيل الصفحة
        loadBookings();
    </script>
</body>
</html>
