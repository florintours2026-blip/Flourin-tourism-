<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات الجواز والدفع - Flourni Tourism</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Flourni Tourism</div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="booking.html">الحجوزات والفنادق</a>
            <a href="payment.html">بيانات الجواز والدفع</a>
        </nav>
    </header>

    <!-- قسم بيانات الجواز والذكاء الاصطناعي -->
    <section class="card">
        <h2>إدخال بيانات جواز السفر</h2>
        <div class="ai-upload">
            <label>📷 ارفع صورة جواز السفر لقراءتها بالذكاء الاصطناعي:</label>
            <input type="file" id="passport-file" accept="image/*" onchange="simulateAIOCR()">
            <p style="font-size: 0.8rem; color: #666;">سيقوم الذكاء الاصطناعي بملء الحقول أدناه تلقائياً وبدقة عالية.</p>
        </div>

        <div class="passport-form">
            <input type="text" id="pass-name" placeholder="الاسم الكامل (كما في الجواز)">
            <input type="text" id="pass-number" placeholder="رقم جواز السفر">
            <input type="text" id="pass-nationality" placeholder="الجنسية">
        </div>
    </section>

    <!-- قسم الدفع الإلكتروني -->
    <section class="card">
        <h2>خيارات الدفع المتاحة</h2>
        <div class="payment-options">
            <div class="pay-card">
                <input type="radio" name="pay-method" id="bankak">
                <label for="bankak">**تطبيق بنكك** (سوداني)</label>
            </div>
            <div class="pay-card">
                <input type="radio" name="pay-method" id="vodafone">
                <label for="vodafone">**فودافون كاش**</label>
            </div>
            <div class="pay-card">
                <input type="radio" name="pay-method" id="card">
                <label for="card">**فيزا / ماستر كارد**</label>
            </div>
        </div>
        <button onclick="confirmPayment()">تأكيد الحجز والدفع الآن</button>
    </section>

    <footer>
        <p>تواصل معنا: flournitourism2026@gmail.com | واتساب: 201065859268+</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
