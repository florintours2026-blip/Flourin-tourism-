<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعار فلورين لخدمات السفر والسياحة</title>
    <style>
        /* إعدادات عامة للصفحة لتوسيط الشعار */
        body {
            background-color: #fbfbfb; /* لون خلفية مقارب للون خلفية الشعار */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* حاوية الشعار */
        .logo-wrapper {
            max-width: 450px; /* يمكنك تعديل هذا الرقم لتغيير حجم الشعار */
            width: 90%;
            padding: 20px;
            text-align: center;
        }

        /* إعدادات الصورة نفسها */
        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            transition: transform 0.4s ease, filter 0.4s ease;
            filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.1)); /* ظل خفيف لإبراز الشعار */
        }

        /* تأثير عند تمرير الماوس */
        .logo-wrapper img:hover {
            transform: scale(1.05); /* تكبير الشعار بنسبة 5% عند تمرير الماوس */
            filter: drop-shadow(0px 8px 15px rgba(212, 175, 55, 0.3)); /* زيادة الظل وإعطائه لمسة ذهبية */
        }
    </style>
</head>
<body>

    <!-- بداية قسم الشعار -->
    <div class="logo-wrapper">
        <a href="index.html" title="العودة إلى الصفحة الرئيسية">
            <!-- تأكد من وضع مسار الصورة الصحيح هنا بدلاً من logo.png -->
            <img src="logo.png" alt="شعار فلورين لخدمات السفر والسياحة - Florin Tours Agency">
        </a>
    </div>
    <!-- نهاية قسم الشعار -->

</body>
</html>
