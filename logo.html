<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعار فلورين للسفر والسياحة</title>
    <style>
        /* تنسيقات حاوية الشعار */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: transparent; 
        }

        /* تنسيقات الصورة نفسها */
        .florin-logo {
            max-width: 100%;
            height: auto;
            width: 250px; /* يمكنك زيادة أو تقليل هذا الرقم للتحكم بحجم الشعار */
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        /* تأثير حركي بسيط عند تمرير الماوس */
        .florin-logo:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- حاوية الشعار -->
    <div class="logo-container">
        <!-- يرجى استبدال 'logo.jpg' بمسار أو اسم الصورة الفعلي لدياك -->
        <img src="logo.jpg" alt="شعار فلورين لخدمات السفر والسياحة" class="florin-logo">
    </div>

</body>
</html>
