<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تسجيل الدخول المتكاملة - Florin Tours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-matte: #A8894A;
            --gold-light: #C9A96E;
            --dark-comfort: #1A1A1A;
            --dark-bg: #0D0D0D;
            --dark-card: #141414;
            --text-light: #E0E0E0;
            --text-muted: #999;
            --border-dark: #2A2A2A;
            --cyan-accent: #00b4d8;
            --purple-accent: #7209b7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: var(--dark-card);
            border: 1px solid var(--border-dark);
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.5s ease-in-out;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-logo img {
            height: 65px;
            width: auto;
            object-fit: contain;
        }

        .category-tabs {
            display: flex;
            background: var(--dark-bg);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 25px;
            gap: 5px;
            flex-wrap: wrap;
        }

        .category-tab {
            flex: 1;
            text-align: center;
            padding: 12px 5px;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 14px;
            border-radius: 8px;
            transition: all 0.3s ease;
            user-select: none;
            min-width: fit-content;
            white-space: nowrap;
        }

        .category-tab:hover {
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.05);
        }

        .category-tab.active[data-type="client"] {
            background: var(--gold-matte);
            color: var(--dark-comfort);
        }

        .category-tab.active[data-type="staff"] {
            background: #10b981;
            color: white;
        }

        .category-tab.active[data-type="agency"] {
            background: #0284c7;
            color: white;
        }

        .notice-box {
            background: rgba(255, 255, 255, 0.03);
            border-right: 4px solid var(--gold-matte);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            color: var(--text-light);
            line-height: 1.6;
            transition: border-color 0.3s ease;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        .form-label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-input {
            background: var(--dark-bg);
            border: 1px solid var(--border-dark);
            color: var(--text-light);
            padding: 12px 15px;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--gold-light);
            box-shadow: 0 0 0 3px rgba(168, 137, 74, 0.1);
        }

        .btn-auth {
            width: 100%;
            background: var(--gold-matte);
            color: var(--dark-comfort);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(168, 137, 74, 0.2);
        }

        .btn-auth:active {
            transform: translateY(0);
        }

        .back-home {
            text-align: center;
            margin-top: 25px;
        }

        .back-home a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-home a:hover {
            color: var(--gold-light);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تحسينات للموبايل */
        @media (max-width: 480px) {
            .auth-container {
                padding: 25px 15px;
                border-radius: 15px;
            }
            .category-tab {
                font-size: 12px;
                padding: 10px 3px;
            }
            .auth-logo img {
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-logo">
            <img src="logo.png" alt="Florin Tours Logo" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend', '<p style=\'color:#A8894A; font-weight:700; font-size:20px;\'>Florin Tours</p>')">
        </div>

        <div class="category-tabs">
            <div class="category-tab active" data-type="client" onclick="switchPortal('client')">دخول العملاء</div>
            <div class="category-tab" data-type="staff" onclick="switchPortal('staff')">قطاع الموظفين</div>
            <div class="category-tab" data-type="agency" onclick="switchPortal('agency')">دخول الوكالات</div>
        </div>

        <div class="notice-box" id="portal-notice">
            مرحباً بك في بوابة عملاء فلورين. يمكنك تسجيل الدخول لمتابعة رحلاتك المحجوزة واستعراض التذاكر المتاحة.
        </div>

        <form id="universal-form" onsubmit="handleLogin(event)">
            <div class="form-group" id="group-id" style="display: none;">
                <label class="form-label" id="label-id">الرقم الوظيفي / الكود الخاص</label>
                <input type="text" class="form-input" id="input-id" placeholder="أدخل الكود التعريفي" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label class="form-label">البريد الإلكتروني المعتمد</label>
                <input type="email" class="form-input" placeholder="example@florintours.com" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <input type="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-auth" id="btn-submit">تسجيل الدخول الآمن</button>
        </form>

        <div class="back-home">
            <a href="index.html">← العودة للصفحة الرئيسية</a>
        </div>
    </div>

    <script>
        let currentPortal = 'client';

        function switchPortal(portal) {
            currentPortal = portal;
            const tabs = document.querySelectorAll('.category-tab');
            const notice = document.getElementById('portal-notice');
            const groupId = document.getElementById('group-id');
            const labelId = document.getElementById('label-id');
            const inputId = document.getElementById('input-id');
            const btnSubmit = document.getElementById('btn-submit');

            tabs.forEach(tab => tab.classList.remove('active'));
            
            const activeTab = document.querySelector(`.category-tab[data-type="${portal}"]`);
            if (activeTab) {
                activeTab.classList.add('active');
            }

            switch(portal) {
                case 'client':
                    notice.style.borderColor = '#A8894A';
                    notice.innerText = 'مرحباً بك في بوابة عملاء فلورين. يمكنك تسجيل الدخول لمتابعة رحلاتك المحجوزة واستعراض التذاكر المتاحة.';
                    groupId.style.display = 'none';
                    inputId.required = false;
                    inputId.value = '';
                    btnSubmit.style.background = '#A8894A';
                    btnSubmit.style.color = '#1A1A1A';
                    break;
                    
                case 'staff':
                    notice.style.borderColor = '#10b981';
                    notice.innerText = 'بوابة الموظفين واللوحة الإدارية: تخولك هذه الواجهة كموظف تعديل العروض السياحية الحالية، تحديث الأسعار، ومتابعة حجوزات الطيران والفنادق الواردة من العملاء فورياً.';
                    groupId.style.display = 'flex';
                    labelId.innerText = 'الرقم الوظيفي (Staff ID)';
                    inputId.placeholder = 'مثال: FT-2026';
                    inputId.required = true;
                    inputId.value = '';
                    btnSubmit.style.background = '#10b981';
                    btnSubmit.style.color = '#fff';
                    break;

                case 'agency':
                    notice.style.borderColor = '#0284c7';
                    notice.innerText = 'بوابة الوكالات السياحية الشريكة. يرجى إدخال كود الوكالة المعتمد لدينا لمتابعة مبيعات البكجات والعملاء المشتركين.';
                    groupId.style.display = 'flex';
                    labelId.innerText = 'كود الوكالة (Agency ID)';
                    inputId.placeholder = 'مثال: AG-2026';
                    inputId.required = true;
                    inputId.value = '';
                    btnSubmit.style.background = '#0284c7';
                    btnSubmit.style.color = '#fff';
                    break;
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            alert('تم تسجيل الدخول بنجاح إلى بوابة ' + (currentPortal === 'client' ? 'العملاء' : currentPortal === 'staff' ? 'الموظفين' : 'الوكالات') + '!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
